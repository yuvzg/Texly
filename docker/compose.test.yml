name: texly-test

services:
  postgres:
    image: postgres:17-alpine
    container_name: texly-postgres-test
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-texly_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-texly_test_secret}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-texly_test}
    ports:
      - '${TEST_POSTGRES_PORT:-5434}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${TEST_POSTGRES_USER:-texly_test} -d ${TEST_POSTGRES_DB:-texly_test}',
        ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - texly-test-network

  redis:
    image: redis:7-alpine
    container_name: texly-redis-test
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    ports:
      - '${TEST_REDIS_PORT:-6381}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - texly-test-network

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: texly-minio-test
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${TEST_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${TEST_MINIO_ROOT_PASSWORD:-minioadmin_secret}
    ports:
      - '${TEST_MINIO_PORT:-9002}:9000'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - texly-test-network

networks:
  texly-test-network:
    driver: bridge
