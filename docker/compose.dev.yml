name: texly-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: texly-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-texly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-texly_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-texly}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-texly} -d ${POSTGRES_DB:-texly}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - texly-dev-network

  redis:
    image: redis:7-alpine
    container_name: texly-redis-dev
    restart: unless-stopped
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - texly-dev-network

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: texly-minio-dev
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - texly-dev-network

  minio-init:
    image: minio/mc:latest
    container_name: texly-minio-init-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin_secret};
      /usr/bin/mc mb local/texly-dev-projects || true;
      exit 0;
      "
    networks:
      - texly-dev-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: texly-mailpit-dev
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8025/api/v1/info || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - texly-dev-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  texly-dev-network:
    driver: bridge
